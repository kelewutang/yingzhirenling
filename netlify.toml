[build]
  publish = "dist"
  command = "npm ci && npm run build"

# Deploy Preview uses the same static build pipeline as Production.
[context.deploy-preview]
  publish = "dist"
  command = "npm ci && npm run build"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

