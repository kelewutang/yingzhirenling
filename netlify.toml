[build]
  publish = "dist"
  command = "npx --yes --package=npm@11.17.0 --call 'node --version && npm --version && npm ci && npm run build'"

[build.environment]
  # Keep npm aligned with packageManager when Node's bundled npm changes.
  NPM_VERSION = "11.17.0"

# Deploy Preview uses the same static build pipeline as Production.
[context.deploy-preview]
  publish = "dist"
  command = "npx --yes --package=npm@11.17.0 --call 'node --version && npm --version && npm ci && npm run build'"

# onSuccess runs only after a successful deploy. Keeping this declaration in
# the production context prevents Preview, branch, and local deploy contexts
# from loading the IndexNow notification plugin at all.
[[context.production.plugins]]
  package = "./plugins/netlify-plugin-indexnow"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

